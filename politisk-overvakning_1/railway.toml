[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python3 hent.py"

# Ingen healthcheck: dette er en cron-jobb, ikke en webtjeneste. Det finnes
# ingen port å sjekke, og containeren skal avslutte når jobben er gjort.
#
# restartPolicyType = "never" er med vilje. Standard er å restarte ved feil,
# og for en cron-jobb betyr det at én feilende kjøring blir til ti kjøringer
# og ti alarmer. Neste planlagte kjøring prøver uansett på nytt.
restartPolicyType = "never"

# MERK: cron-timeplanen settes IKKE her. Den settes i Railway-dashbordet under
# Service → Settings → Cron Schedule. Anbefalt:
#
#     0 5,11 * * 1-5     kl. 07:00 og 13:00 norsk tid, ukedager
#
# Railway tolker alle uttrykk i UTC, så juster for sommertid (norsk tid er
# UTC+2 om sommeren, UTC+1 om vinteren).
#
# Viktig: Railway hopper over en kjøring hvis den forrige fortsatt er aktiv,
# og sier ikke fra. Derfor har hent.py en vaktbikkje (MAKS_SEKUNDER) som
# garanterer at prosessen avslutter.
