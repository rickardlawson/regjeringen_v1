{% extends "base.html" %}
{% block tittel %}Sjekk e-posten{% endblock %}
{% block innhold %}
<div style="max-width:420px;margin:40px auto">
  <h1>Sjekk e-posten</h1>
  <p class="ingress">Vi sendte en innloggingslenke til <strong>{{ epost }}</strong>.
    Lenken virker i 30 minutter og kan bare brukes én gang.</p>
  <p class="hjelp">Finner du den ikke, sjekk søppelposten.
    <a href="{{ url_for('logg_inn') }}">Prøv en annen adresse</a>.</p>
</div>
{% endblock %}
